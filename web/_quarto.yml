project:
  type: website
  output-dir: _site
  resources:
    - "data/**"
    - "js/**"
    - "vendor/**"

lang: pt-BR

website:
  title: "Dudes Fantasy"
  favicon: favicon.svg
  reader-mode: false
  navbar:
    background: "#050921"
    left:
      - text: "Minha semana"
        menu:
          - { text: "Painel",    href: index.qmd }
          - { text: "Confronto", href: matchup.qmd }
          - { text: "Escalação", href: lineup.qmd }
      - text: "Mercado"
        menu:
          - { text: "Waivers", href: waivers.qmd }
          - { text: "Trocas",  href: trades.qmd }
      - text: "Liga"
        menu:
          - { text: "Placar da rodada", href: scoreboard.qmd }
          - { text: "Classificação e força", href: league.qmd }
      - text: "Dados"
        menu:
          - { text: "Jogadores",          href: players.qmd }
          - { text: "Projeções e fontes", href: projections.qmd }
          - { text: "Saúde dos dados",    href: data-health.qmd }

format:
  html:
    theme: [darkly, css/theme.scss]
    page-layout: full
    toc: false
    anchor-sections: false
    include-in-header: js/head.html
    grid:
      body-width: 1400px
